  <g font-family="Century Gothic" font-size="28" fill="#5B6779" text-anchor="end"><text x="1920" y="230">Impression &amp; production sur mesure</text><text x="1920" y="272">Rue 04 N° 57, Cité Azemour, Errachidia</text><text x="1920" y="314">+212 6 70 36 70 05 · www.mslab.ma</text></g>
  <rect x="180" y="440" width="1740" height="2" fill="#D3D0C6"/>
  <g font-family="Georgia" fill="#0E1A2B">
  <text x="1920" y="580" text-anchor="end" font-size="38">Errachidia, le 14 janvier 2027</text>
  <text x="180" y="740" font-size="40" font-weight="bold">Objet : votre demande de devis de production</text>
  <g font-size="38" fill="#2A3A44">
  <text x="180" y="870">Madame, Monsieur,</text>
  <text x="180" y="970">Nous vous remercions pour votre demande. Afin d’établir un devis précis,</text>
  <text x="180" y="1026">nous vous invitons à nous préciser les éléments suivants :</text>
  <text x="180" y="1110">— le produit et son format, ainsi que le support souhaité ;</text>
  <text x="180" y="1166">— la quantité à produire et, le cas échéant, les déclinaisons ;</text>
  <text x="180" y="1222">— vos fichiers ou votre idée de design, et la date de livraison visée.</text>
  <text x="180" y="1322">Chaque commande est étudiée et chiffrée sur devis : nous revenons vers</text>
  <text x="180" y="1378">vous avec une proposition adaptée à votre projet et à vos quantités.</text>
  <text x="180" y="1478">Nous restons à votre disposition pour en discuter par téléphone ou à</text>
  <text x="180" y="1534">notre atelier d’Errachidia.</text>
  <text x="180" y="1634">Veuillez agréer, Madame, Monsieur, nos salutations distinguées.</text>
  </g>
  <text x="180" y="1830" font-size="40" font-style="italic">L’équipe MSLAB</text>
  </g>

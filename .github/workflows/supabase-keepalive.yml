# Production runs on the Supabase FREE plan (ADR-020). Free projects are paused after a period of
# inactivity; because public pages are cached, a quiet week could produce no database traffic.
# This job makes one tiny read-only request per day with the PUBLIC (publishable) key.
#
# Repository VARIABLES (not secrets — the publishable key is public and RLS-restricted):
#   KEEPALIVE_SUPABASE_URL                 e.g. https://<prod-ref>.supabase.co
#   KEEPALIVE_SUPABASE_PUBLISHABLE_KEY     sb_publishable_…
# Note: GitHub disables scheduled workflows after 60 days without repository activity; re-enable
# it from the Actions tab if that happens.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.KEEPALIVE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.KEEPALIVE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Read one public row
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::Keep-alive variables not set; nothing to do."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase returned HTTP $status — the project may be paused. Restore it from the Supabase dashboard."
            exit 1
          fi
